[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultscrub"
version = "0.1.0"
description = "Zero-dependency secret and PII redaction for Python applications, logs, and CI pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "javid0x1" }]
keywords = ["security", "secrets", "pii", "redaction", "logging", "ci", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
vaultscrub = "vaultscrub.cli:main"

[project.urls]
Homepage = "https://github.com/alireza0xj/javid0x1"
Repository = "https://github.com/alireza0xj/javid0x1"
Issues = "https://github.com/alireza0xj/javid0x1/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
# Note: no python_version pin — the code stays 3.9-compatible via
# `from __future__ import annotations` and ruff's py39 target.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
